<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <div class="navbar">

        <h2>Inventory Management</h2>

        <a href="dashboard.html" id="dashboardLink">
            Dashboard
        </a>

    </div>

    <div class="container">

        <!-- Page Header -->

        <div class="page-header">

            <h1 id="inventoryTitle">
                Product Inventory
            </h1>

            <button
                id="addProductBtn"
                class="btn btn-success">

                + Add Product

            </button>

        </div>

        <!-- Search -->

        <div style="margin-bottom:20px;">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Product..."
                style="width:300px;padding:10px;border-radius:6px;border:1px solid #ccc;">

        </div>

        <!-- Product Table -->

        <table id="productTable">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productTableBody">

                <!-- JavaScript loads rows here -->

            </tbody>

        </table>

    </div>

    <!-- =============================
            Product Modal
    ============================== -->

    <div
        id="productModal"
        class="modal">

        <div class="modal-content">

            <h2 id="modalTitle">

                Add Product

            </h2>

            <br>

            <input
                id="productId"
                type="hidden">

            <div class="form-group">

                <label>Product Name</label>

                <input
                    id="productName"
                    type="text">

            </div>

            <div class="form-group">

                <label>Quantity</label>

                <input
                    id="productQty"
                    type="number">

            </div>

            <div class="form-group">

                <label>Price</label>

                <input
                    id="productPrice"
                    type="number">

            </div>

            <button
                id="saveProductBtn"
                class="btn btn-success">

                Save

            </button>

            <button
                id="cancelBtn"
                class="btn btn-danger">

                Cancel

            </button>

        </div>

    </div>

    <div class="footer">

        Inventory Management System © 2026

    </div>

    <script src="js/auth.js"></script>
<script src="js/inventory.js"></script>

</body>

</html>
